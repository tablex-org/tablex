[package]
name = "dbengine-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "dbengine_core"

[dependencies]
engine-ffi-util = { path = "../engine-ffi-util" }
engine-storage = { path = "../engine-storage" }
engine-syntax = { path = "../engine-syntax" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter-json = "0.24.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
