[package]
name = "engine-ai"
version = "0.1.0"
edition = "2021"
description = "UI-free AI assistant core for TableX: conversation, provider-neutral chat types, the Anthropic Messages API over an injected HTTP transport, and the tool loop over the agent tool layer"

[dependencies]
engine-agent = { path = "../engine-agent" }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: object keys keep the order the API sent, in every build (the app enables it anyway).
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
zeroize = "1"
