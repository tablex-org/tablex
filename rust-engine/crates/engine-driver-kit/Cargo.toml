[package]
name = "engine-driver-kit"
version = "0.1.0"
edition = "2021"
description = "Shared ABI v2 FFI glue for TableX driver dylibs (session/page registries, Arrow leases, cancel, panic safety)"

[dependencies]
arrow-array = { version = "53", features = ["ffi"] }
arrow-buffer = "53"
arrow-cast = "53"
arrow-schema = "53"
engine-driver-api = { path = "../engine-driver-api" }
engine-ffi-util = { path = "../engine-ffi-util" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
