[package]
name = "dbengine-redis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "dbengine_redis"

[features]
default = []
# ABI v2 on engine-driver-kit; replaces the ABI 1 exports.
abi-v2 = ["dep:engine-driver-kit", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
arrow-array = { version = "53", features = ["ffi"], optional = true }
arrow-schema = { version = "53", optional = true }
engine-driver-kit = { path = "../engine-driver-kit", optional = true }
engine-ffi-util = { path = "../engine-ffi-util" }
redis = { version = "0.32.2", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp", "sentinel", "cluster-async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
lazy_static = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
arrow-array = { version = "53", features = ["ffi"] }
engine-driver-api = { path = "../engine-driver-api" }
engine-driver-host = { path = "../engine-driver-host" }
tempfile = "3.14"
