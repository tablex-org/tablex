  found_one:
    en: "1 setting for “%{query}”"
    vi: "1 cài đặt cho “%{query}”"
  found_other:
    en: "%{count} settings for “%{query}”"
    vi: "%{count} cài đặt cho “%{query}”"
  shortcuts_found:
    en: "SHORTCUTS (%{count})"
    vi: "PHÍM TẮT (%{count})"
  api_key:
    en: API KEY
    vi: KHOÁ API
  developer:
