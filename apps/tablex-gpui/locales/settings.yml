      en: Developer mode
      vi: Chế độ nhà phát triển
    description:
      en: "Accept unsigned local drivers and manifests. Takes effect immediately; it is stored with the drivers, not in this Settings file."
      vi: "Chấp nhận driver và manifest cục bộ chưa ký. Có hiệu lực ngay; được lưu cùng các driver, không lưu trong tệp Cài đặt này."
    open_driver_manager:
      en: Open Driver Manager
      vi: Mở Driver Manager
  about:
    not_saved:
      en: not saved (no config folder)
      vi: không lưu (không có thư mục cấu hình)
    version:
      en: Version
      vi: Phiên bản
    settings_file:
      en: Settings file
      vi: Tệp cài đặt
  footer:
    reset_defaults:
      en: Reset Defaults
      vi: Đặt lại mặc định
    fix_values:
      en: Fix the highlighted values to apply
      vi: Sửa các giá trị được tô sáng để áp dụng
    not_applied:
      en: Changes not applied
      vi: Thay đổi chưa được áp dụng
    apply:
      en: Apply
      vi: Áp dụng
    apply_close:
      en: Apply and Close
      vi: Áp dụng và đóng
  types:
    unnamed:
      en: "(unnamed)"
      vi: "(chưa đặt tên)"
    add:
      en: Add type
      vi: Thêm loại
    heading:
      en: CONNECTION TYPES
      vi: LOẠI KẾT NỐI
    help:
      en: A connection type gives its connections a color and safety presets. Pick one in the connection dialog (Environment); connections without a type follow the global settings only.
      vi: Loại kết nối cho các kết nối của nó một màu và các cài đặt an toàn có sẵn. Chọn loại trong hộp thoại kết nối (Môi trường); kết nối không có loại chỉ theo cài đặt chung.
    name:
      en: Name
      vi: Tên
    color:
      en: Color
      vi: Màu
    agent_access:
      en: Agent access
      vi: Quyền của agent
    agent_access_help:
      en: "What an AI agent (the in-app assistant, MCP clients) may do on connections of this type that set nothing themselves. Read and write is allowed on types that are not Production, and each change is still put to you for approval. A Production type always needs the connection's own setting, and a read-only type caps every connection at Read."
      vi: "Việc mà một agent AI (trợ lý trong ứng dụng, client MCP) được làm trên các kết nối thuộc loại này mà không tự đặt gì. Đọc và ghi được phép trên các loại không phải Production, và mỗi thay đổi vẫn được hỏi bạn duyệt. Loại Production luôn cần cài đặt riêng của kết nối, và loại chỉ đọc giới hạn mọi kết nối ở mức Đọc."
    delete:
      en: Delete type
      vi: Xoá loại
  shortcuts:
    reset_all:
      en: Reset all
      vi: Đặt lại tất cả
    fixed:
      en: Fixed
      vi: Cố định
    press_keys:
      en: Press keys…
      vi: Nhấn phím…
    change:
      en: Click to change this shortcut
      vi: Bấm để đổi phím tắt này
    remove:
      en: Remove this shortcut
      vi: Xoá phím tắt này
    not_set:
      en: Not set
      vi: Chưa đặt
    record:
      en: Record
      vi: Ghi
  item:
    appearance:
      theme:
        title:
          en: Theme
          vi: Chủ đề
        description:
          en: "Dark, Light, or follow the operating system's appearance and switch with it."
          vi: "Tối, Sáng hoặc theo giao diện của hệ điều hành và đổi theo nó."
        options:
          dark:
            en: Dark
            vi: Tối
          light:
            en: Light
            vi: Sáng
          system:
            en: System (follow the OS)
            vi: Hệ thống (theo hệ điều hành)
      language:
        title:
          en: Language
          vi: Ngôn ngữ
        description:
          en: "Language of menus, labels and messages. System follows the preferred language of the operating system. Data, SQL and database messages are never translated."
          vi: "Ngôn ngữ của menu, nhãn và thông báo. Hệ thống theo ngôn ngữ ưu tiên của hệ điều hành. Dữ liệu, SQL và thông báo của cơ sở dữ liệu không bao giờ được dịch."
        options:
          system:
            en: System (follow the OS)
            vi: Hệ thống (theo hệ điều hành)
          en:
            en: English
            vi: English
          vi:
            en: Tiếng Việt
            vi: Tiếng Việt
      ui_scale:
        title:
          en: UI scale
          vi: Tỷ lệ giao diện
        description:
          en: Zoom of the whole interface.
          vi: Thu phóng toàn bộ giao diện.
      interface_font:
        title:
          en: Interface font
          vi: Phông giao diện
        description:
          en: "Font of menus, tabs, the sidebar and dialogs. Empty uses the system font."
          vi: "Phông của menu, tab, thanh bên và hộp thoại. Để trống để dùng phông hệ thống."
      grid_font:
        title:
          en: Grid font
          vi: Phông lưới
        description:
          en: Font of result grid cells. Empty uses the interface font.
          vi: Phông của các ô trong lưới kết quả. Để trống để dùng phông giao diện.
      grid_font_size:
        title:
          en: Grid font size
          vi: Cỡ chữ lưới
        description:
          en: "Text size of result grid cells, in pixels."
          vi: "Cỡ chữ của các ô trong lưới kết quả, tính bằng pixel."
      editor_font:
        title:
          en: Editor font
          vi: Phông trình soạn thảo
        description:
          en: Monospace font of SQL and script editors. Empty uses the platform default.
          vi: Phông đơn cách của trình soạn thảo SQL và script. Để trống để dùng phông mặc định của nền tảng.
      editor_font_size:
        title:
          en: Editor font size
          vi: Cỡ chữ trình soạn thảo
        description:
          en: "Text size of SQL and script editors, in pixels."
          vi: "Cỡ chữ của trình soạn thảo SQL và script, tính bằng pixel."
      tab_group_by:
        title:
          en: Group tabs by
          vi: Nhóm tab theo
        description:
          en: Default grouping of the tab bar.
          vi: Cách nhóm mặc định của thanh tab.
        options:
          none:
            en: Do not group
            vi: Không nhóm
          connection:
            en: Connection
            vi: Kết nối
          database:
            en: Database
            vi: Cơ sở dữ liệu
      tab_rows:
        title:
          en: Show tabs in a second row
          vi: Hiện tab ở dòng thứ hai
        description:
          en: "Group chips on one row and the active group's tabs on a second. Needs grouping."
          vi: "Các nhóm nằm trên một dòng, tab của nhóm đang chọn nằm ở dòng thứ hai. Cần bật nhóm tab."
      compact_tab_titles:
        title:
          en: Shorten tab titles
          vi: Rút gọn tiêu đề tab
        description:
          en: "Drop the @database suffix from tab labels."
          vi: "Bỏ phần @database ở cuối tiêu đề tab."
      show_fps:
        title:
          en: Show FPS counter
          vi: Hiện bộ đếm FPS
        description:
          en: "Debug metric: frames per second in the status bar."
          vi: "Chỉ số gỡ lỗi: số khung hình mỗi giây trên thanh trạng thái."
      error_log_place:
        title:
          en: Error Log position
          vi: Vị trí nhật ký lỗi
        description:
          en: "Where the Error Log opens: at the bottom of the window, on the right, or in a tab of its own. The position button in the Error Log header changes it too."
          vi: "Nơi nhật ký lỗi mở ra: ở dưới cửa sổ, ở bên phải hoặc trong một tab riêng. Nút vị trí trên tiêu đề nhật ký lỗi cũng đổi được mục này."
        options:
          bottom:
            en: Bottom
            vi: Dưới
          right:
            en: Right
            vi: Bên phải
          tab:
            en: In a tab of its own
            vi: Trong tab riêng
    updates:
      check_automatically:
        title:
          en: Check for updates automatically
          vi: Tự động kiểm tra cập nhật
        description:
          en: "Once a day, when tablex starts, ask GitHub whether a newer version exists. Nothing but the request itself is sent. Check for Updates in the command palette works either way."
          vi: "Mỗi ngày một lần, khi tablex khởi động, hỏi GitHub xem có phiên bản mới không. Chỉ gửi đúng yêu cầu đó. Lệnh Kiểm tra cập nhật trong bảng lệnh vẫn dùng được dù bật hay tắt."
    editor:
      line_numbers:
        title:
          en: Line numbers
          vi: Số dòng
        description:
          en: Show line numbers in the gutter.
          vi: Hiện số dòng ở lề trái.
      soft_wrap:
        title:
          en: Soft wrap
          vi: Tự xuống dòng
        description:
          en: Wrap long lines instead of scrolling horizontally.
          vi: Xuống dòng với dòng dài thay vì cuộn ngang.
      tab_size:
        title:
          en: Tab size
          vi: Cỡ tab
        description:
          en: "Width of an indent, in spaces."
          vi: "Độ rộng của một mức thụt lề, tính bằng khoảng trắng."
      auto_close:
        title:
          en: Auto-close brackets and quotes
          vi: Tự đóng ngoặc và dấu nháy
        description:
          en: Type an opening bracket or quote and get the closing one.
          vi: Gõ ngoặc hoặc dấu nháy mở thì tự thêm dấu đóng.
      vim_mode:
        title:
          en: Vim keys
          vi: Phím Vim
        description:
          en: "Use Vim keys (Normal, Insert and Visual modes) in the query editors. Each editor also has its own switch in its status line."
          vi: "Dùng phím Vim (chế độ Normal, Insert và Visual) trong trình soạn truy vấn. Mỗi trình soạn cũng có công tắc riêng ở thanh trạng thái."
      vim_default_mode:
        title:
          en: Start in
          vi: Bắt đầu ở chế độ
        description:
          en: The Vim mode an editor starts in, when it opens or when Vim is switched on for it.
          vi: Chế độ Vim mà trình soạn bắt đầu, khi mở ra hoặc khi bật Vim cho nó.
        options:
          normal:
            en: Normal
            vi: Normal
          insert:
            en: Insert
            vi: Insert
      vim_clipboard:
        title:
          en: Use the system clipboard
          vi: Dùng bộ nhớ tạm của hệ thống
        description:
          en: "Always: every yank, delete and change is copied to the system clipboard and p pastes from it. On yank: only a yank is copied; p pastes the last yank or delete. Never: Vim keeps its own register."
          vi: "Luôn luôn: mọi lệnh yank, xoá và đổi đều được chép vào bộ nhớ tạm của hệ thống và p dán từ đó. Khi yank: chỉ yank được chép; p dán lần yank hoặc xoá gần nhất. Không bao giờ: Vim dùng thanh ghi riêng."
        options:
          always:
            en: Always
            vi: Luôn luôn
          on_yank:
            en: On yank
            vi: Khi yank
          never:
            en: Never
            vi: Không bao giờ
      vim_escape_sequence:
        title:
          en: Escape sequence
          vi: Chuỗi phím thoát
        description:
          en: "Two keys typed one after the other in Insert mode that leave it, such as jk or jj. Empty turns it off. While you type the first key, it is held back until the second one comes or the time below runs out."
          vi: "Hai phím gõ liên tiếp trong chế độ Insert để thoát khỏi nó, như jk hoặc jj. Để trống là tắt. Phím đầu được giữ lại cho đến khi phím thứ hai tới hoặc hết thời gian chờ bên dưới."
      vim_escape_timeout:
        title:
          en: Escape sequence timeout
          vi: Thời gian chờ chuỗi phím thoát
        description:
          en: Milliseconds the second key of the escape sequence may take.
          vi: Số mili giây tối đa cho phím thứ hai của chuỗi phím thoát.
      vim_highlight_yank:
        title:
          en: Highlight on yank
          vi: Tô sáng khi yank
        description:
          en: Milliseconds the yanked text stays highlighted. 0 turns it off.
          vi: Số mili giây văn bản vừa yank được tô sáng. 0 là tắt.
      vim_ctrl_keys:
        title:
          en: Take Ctrl keys
          vi: Dùng phím Ctrl
        description:
          en: "Vim handles Ctrl-R (redo), Ctrl-D and Ctrl-U (half a page) and Ctrl-[ (Escape). Off leaves them to the editor and the app; Escape works either way."
          vi: "Vim xử lý Ctrl-R (làm lại), Ctrl-D và Ctrl-U (nửa trang) và Ctrl-[ (Escape). Tắt thì để các phím này cho trình soạn và ứng dụng; phím Escape vẫn dùng được."
      vim_ignore_case:
        title:
          en: Search ignores case
          vi: Tìm kiếm không phân biệt hoa thường
        description:
          en: "A search with / ? * # does not tell a from A."
          vi: "Tìm bằng / ? * # không phân biệt a với A."
      vim_smart_case:
        title:
          en: Smart case
          vi: Phân biệt hoa thường thông minh
        description:
          en: A search that contains a capital letter is case sensitive again. Needs Search ignores case.
          vi: Tìm kiếm có chứa chữ hoa thì lại phân biệt hoa thường. Cần bật Tìm kiếm không phân biệt hoa thường.
      autocomplete_auto_trigger:
        title:
          en: Open suggestions while typing
          vi: Mở gợi ý khi đang gõ
        description:
          en: Show the suggestion list while typing. Off disables the list.
          vi: Hiện danh sách gợi ý khi đang gõ. Tắt thì không hiện danh sách.
      autocomplete_insert_space:
        title:
          en: Insert a space after keywords
          vi: Thêm khoảng trắng sau từ khoá
        description:
          en: Accepting a keyword suggestion adds a trailing space.
          vi: Chọn một gợi ý từ khoá sẽ thêm một khoảng trắng phía sau.
      autocomplete_max_items:
        title:
          en: Maximum suggestions
          vi: Số gợi ý tối đa
        description:
          en: Most entries the suggestion list shows.
          vi: Số mục nhiều nhất mà danh sách gợi ý hiện ra.
      highlight_current_statement:
        title:
          en: Highlight the current statement
          vi: Tô sáng câu lệnh hiện tại
        description:
          en: Tint the statement under the cursor.
          vi: Tô nền câu lệnh đang chứa con trỏ.
      run_scope:
        title:
          en: Run executes
          vi: Chạy
        description:
          en: What the Run button and the run shortcut execute. A selection is always preferred except for the whole-script choice.
          vi: "Phạm vi mà nút Chạy và phím tắt chạy sẽ thực thi. Phần đang chọn luôn được ưu tiên, trừ khi chọn chạy cả script."
        options:
          current:
            en: Current statement
            vi: Câu lệnh hiện tại
          selection:
            en: Selection (else everything)
            vi: Phần đã chọn (không thì tất cả)
          all:
            en: Whole script
            vi: Cả script
      confirm_dangerous:
        title:
          en: Confirm dangerous statements
          vi: Xác nhận câu lệnh nguy hiểm
        description:
          en: "Ask before running statements a driver flags as dangerous (DROP, DELETE without WHERE, ...). Off runs them without asking."
          vi: "Hỏi trước khi chạy câu lệnh mà driver đánh dấu là nguy hiểm (DROP, DELETE không có WHERE, ...). Tắt thì chạy mà không hỏi."
      preview_affected_rows:
        title:
          en: Preview affected rows before UPDATE/DELETE
          vi: Xem trước các dòng bị ảnh hưởng trước UPDATE/DELETE
        description:
          en: "When a confirmation asks before an UPDATE or DELETE, also count the rows it will change and show the first few, read-only. A statement without WHERE is called out. Statements it cannot read beforehand (joins, CTEs) run as before."
          vi: "Khi hộp xác nhận hỏi trước UPDATE hoặc DELETE, đếm luôn số dòng sẽ bị thay đổi và hiện vài dòng đầu, ở chế độ chỉ đọc. Câu lệnh không có WHERE sẽ được cảnh báo. Câu lệnh không thể đọc trước (join, CTE) vẫn chạy như cũ."
      confirm_unsaved_close:
        title:
          en: Confirm closing unsaved scripts
          vi: Xác nhận khi đóng script chưa lưu
        description:
          en: Ask before closing a query tab whose script was never saved.
          vi: Hỏi trước khi đóng tab truy vấn có script chưa từng được lưu.
      formatter:
        title:
          en: Formatter
          vi: Trình định dạng
        description:
          en: What formats SQL. The built-in formatter needs nothing. SQL Formatter (sqruff) is a separate program installed from the Driver Manager. An external command is a program of yours that reads SQL on its standard input and writes the formatted SQL on its standard output.
          vi: "Thứ dùng để định dạng SQL. Trình tích hợp sẵn không cần gì thêm. SQL Formatter (sqruff) là chương trình riêng, cài từ Driver Manager. Lệnh ngoài là chương trình của bạn, đọc SQL từ đầu vào chuẩn và ghi SQL đã định dạng ra đầu ra chuẩn."
        options:
          built_in:
            en: Built-in
            vi: Tích hợp sẵn
          sqruff:
            en: SQL Formatter (sqruff)
            vi: SQL Formatter (sqruff)
          external:
            en: External command
            vi: Lệnh ngoài
      format_keyword_case:
        title:
          en: Keyword case
          vi: Kiểu chữ của từ khoá
        description:
          en: "The case Format SQL gives reserved words (SELECT, FROM, WHERE, ...) and completion gives the keywords and functions it inserts. Other words keep the case they were typed in. As typed: completion follows the case of the word being typed."
          vi: "Kiểu chữ mà Định dạng SQL áp cho các từ dành riêng (SELECT, FROM, WHERE, ...) và mà gợi ý áp cho từ khoá và hàm nó chèn vào. Các từ khác giữ nguyên như đã gõ. Như đã gõ: gợi ý theo kiểu chữ của từ đang gõ."
        options:
          upper:
            en: UPPER CASE
            vi: CHỮ HOA
          lower:
            en: lower case
            vi: chữ thường
          keep:
            en: As typed
            vi: Như đã gõ
      format_indent:
        title:
          en: Indent width
          vi: Độ rộng thụt lề
        description:
          en: Spaces per indent level in formatted SQL. 0 uses the tab size.
          vi: Số khoảng trắng cho mỗi mức thụt lề trong SQL đã định dạng. 0 là dùng cỡ tab.
      format_lines_between_statements:
        title:
          en: Blank lines between statements
          vi: Dòng trống giữa các câu lệnh
        description:
          en: "Blank lines Format SQL leaves after each statement's semicolon."
          vi: Số dòng trống mà Định dạng SQL để lại sau dấu chấm phẩy của mỗi câu lệnh.
      format_external_program:
        title:
          en: External command
          vi: Lệnh ngoài
        description:
          en: "The program for an external formatter: a name found on your PATH (sqruff, sqlfluff, pg_format, sql-formatter) or a full path."
          vi: "Chương trình của trình định dạng ngoài: tên có trong PATH (sqruff, sqlfluff, pg_format, sql-formatter) hoặc đường dẫn đầy đủ."
      format_external_args:
        title:
          en: External command arguments
          vi: Tham số của lệnh ngoài
        description:
          en: "Arguments, separated by blanks (quote one that contains blanks). {dialect} becomes postgres, mysql, mariadb, sqlite, clickhouse or ansi; {language} the name sql-formatter uses (postgresql, sql, ...)."
          vi: "Các tham số, cách nhau bằng khoảng trắng (đặt trong dấu nháy nếu tham số có khoảng trắng). {dialect} thành postgres, mysql, mariadb, sqlite, clickhouse hoặc ansi; {language} là tên mà sql-formatter dùng (postgresql, sql, ...)."
      format_external_exit_codes:
        title:
          en: External command exit codes that succeed
          vi: Mã thoát của lệnh ngoài được coi là thành công
        description:
          en: "Exit codes, separated by commas, that mean the command worked. A command that prints its result and exits 1 when it could not fix everything (sqruff fix, sqlfluff) needs 0,1. Anything else is a failure and its error output is shown."
          vi: "Các mã thoát, cách nhau bằng dấu phẩy, cho biết lệnh đã chạy được. Lệnh in kết quả rồi thoát với mã 1 khi không sửa hết (sqruff fix, sqlfluff) cần 0,1. Mã khác là lỗi và nội dung lỗi sẽ được hiện ra."
      format_timeout:
        title:
          en: Formatter timeout
          vi: Thời gian chờ của trình định dạng
        description:
          en: Seconds SQL Formatter (sqruff) or an external command may take before it is stopped.
          vi: Số giây tối đa SQL Formatter (sqruff) hoặc lệnh ngoài được chạy trước khi bị dừng.
      results_position:
        title:
          en: Results position
          vi: Vị trí kết quả
        description:
          en: "Where a query tab shows its results: below the editor or right of it. Each tab can also move them to a tab or a window of their own from the Results header."
          vi: "Nơi tab truy vấn hiện kết quả: dưới hoặc bên phải trình soạn thảo. Mỗi tab cũng có thể chuyển kết quả sang một tab hoặc một cửa sổ riêng từ tiêu đề Kết quả."
        options:
          below:
            en: Below the editor
            vi: Dưới trình soạn thảo
          right:
            en: Right of the editor
            vi: Bên phải trình soạn thảo
      on_script_error:
        title:
          en: On error in a script
          vi: Khi script gặp lỗi
        description:
          en: "What a script of several statements does when one fails: stop there (the rest show as skipped in Statistics) or run the remaining statements."
          vi: "Việc script nhiều câu lệnh làm khi một câu lệnh lỗi: dừng tại đó (phần còn lại hiện là đã bỏ qua trong Thống kê) hoặc chạy tiếp các câu lệnh còn lại."
        options:
          stop:
            en: Stop at the failing statement
            vi: Dừng ở câu lệnh lỗi
          continue:
            en: Run the remaining statements
            vi: Chạy các câu lệnh còn lại
      max_result_tabs:
        title:
          en: Result tabs per script
          vi: Số tab kết quả mỗi script
        description:
          en: Most result tabs a script run keeps. Statements past it still run and appear in Statistics as rows not kept.
          vi: Số tab kết quả nhiều nhất mà một lần chạy script giữ lại. Các câu lệnh vượt quá vẫn chạy và hiện trong Thống kê là dòng không được giữ.
      parameters:
        title:
          en: Ask for parameters
          vi: Hỏi tham số
        description:
          en: "Ask for a value before running a statement that has :name or ${name} parameters. Off runs the text as written."
          vi: "Hỏi giá trị trước khi chạy câu lệnh có tham số :name hoặc ${name}. Tắt thì chạy nguyên văn bản."
    results:
      page_size:
        title:
          en: Default page size
          vi: Số dòng mỗi trang
        description:
          en: Rows fetched per page in a new tab.
          vi: Số dòng tải về mỗi trang trong một tab mới.
      null_text:
        title:
          en: NULL display text
          vi: Chữ hiện cho NULL
        description:
          en: What a NULL value shows in the grid.
          vi: Thứ hiện ra trong lưới khi giá trị là NULL.
      right_align_numbers:
        title:
          en: Right-align numbers
          vi: Căn phải số
        description:
          en: Align numeric columns to the right.
          vi: Căn các cột số về bên phải.
      show_row_numbers:
        title:
          en: Show row numbers
          vi: Hiện số dòng
        description:
          en: Show the row number gutter.
          vi: Hiện cột số thứ tự dòng.
      column_width_default:
        title:
          en: Default column width
          vi: Độ rộng cột mặc định
        description:
          en: "Initial width of a column, in pixels."
          vi: "Độ rộng ban đầu của một cột, tính bằng pixel."
      column_width_min:
        title:
          en: Minimum column width
          vi: Độ rộng cột tối thiểu
        description:
          en: "Smallest width a column can be resized to, in pixels."
          vi: "Độ rộng nhỏ nhất khi kéo đổi cỡ cột, tính bằng pixel."
      column_width_max:
        title:
          en: Maximum column width
          vi: Độ rộng cột tối đa
        description:
          en: "Largest width a column can be resized to, in pixels."
          vi: "Độ rộng lớn nhất khi kéo đổi cỡ cột, tính bằng pixel."
      auto_size_columns:
        title:
          en: Size columns from their values
          vi: Cỡ cột theo giá trị
        description:
          en: Fit each column to a sample of its values (within the minimum and maximum) instead of the default width.
          vi: Vừa mỗi cột với một mẫu giá trị của nó (trong khoảng tối thiểu và tối đa) thay vì dùng độ rộng mặc định.
      boolean_display:
        title:
          en: Booleans
          vi: Giá trị boolean
        description:
          en: Show boolean values as text or as a checkbox.
          vi: Hiện giá trị boolean dạng chữ hoặc ô đánh dấu.
        options:
          text:
            en: Text
            vi: Chữ
          checkbox:
            en: Checkbox
            vi: Ô đánh dấu
      datetime_format:
        title:
          en: Date and time format
          vi: Định dạng ngày giờ
        description:
          en: How date-time values are written.
          vi: Cách ghi giá trị ngày giờ.
        options:
          source:
            en: As returned by the database
            vi: Như cơ sở dữ liệu trả về
          iso:
            en: "YYYY-MM-DD HH:MM:SS"
            vi: "YYYY-MM-DD HH:MM:SS"
          iso_millis:
            en: "YYYY-MM-DD HH:MM:SS.mmm"
            vi: "YYYY-MM-DD HH:MM:SS.mmm"
      binary_display:
        title:
          en: Binary values
          vi: Giá trị nhị phân
        description:
          en: Show binary values as hexadecimal or Base64.
          vi: Hiện giá trị nhị phân dạng thập lục phân hoặc Base64.
        options:
          hex:
            en: Hexadecimal
            vi: Thập lục phân
          base64:
            en: Base64
            vi: Base64
      binary_preview_max:
        title:
          en: Binary preview length
          vi: Độ dài xem trước nhị phân
        description:
          en: Most bytes of a binary value shown in a cell.
          vi: Số byte nhiều nhất của giá trị nhị phân hiện trong một ô.
      mongo_json_mode:
        title:
          en: MongoDB JSON mode
          vi: Chế độ JSON của MongoDB
        description:
          en: Relaxed or canonical extended JSON for documents.
          vi: JSON mở rộng dạng Relaxed hoặc Canonical cho các document.
        options:
          relaxed:
            en: Relaxed
            vi: Relaxed
          canonical:
            en: Canonical
            vi: Canonical
      default_copy_format:
        title:
          en: Default copy format
          vi: Định dạng sao chép mặc định
        description:
          en: Format used by the plain Copy command.
          vi: Định dạng mà lệnh Sao chép thông thường dùng.
        options:
          smart:
            en: Smart
            vi: Thông minh
          raw:
            en: Raw values
            vi: Giá trị thô
          tsv:
            en: TSV
            vi: TSV
          tsv_with_headers:
            en: TSV with headers
            vi: TSV có tiêu đề
          csv:
            en: CSV
            vi: CSV
          csv_with_headers:
            en: CSV with headers
            vi: CSV có tiêu đề
          json:
            en: JSON
            vi: JSON
          markdown:
            en: Markdown
            vi: Markdown
      export_delimiter:
        title:
          en: Export delimiter
          vi: Dấu phân cách khi xuất
        description:
          en: Column separator of CSV exports.
          vi: Ký tự ngăn cách các cột trong tệp CSV xuất ra.
      export_header:
        title:
          en: Export header row
          vi: Dòng tiêu đề khi xuất
        description:
          en: Write column names as the first row of CSV exports.
          vi: Ghi tên cột ở dòng đầu của tệp CSV xuất ra.
      export_null_text:
        title:
          en: Export NULL text
          vi: Chữ cho NULL khi xuất
        description:
          en: What a NULL is written as in CSV exports.
          vi: Cách ghi giá trị NULL trong tệp CSV xuất ra.
      export_folder:
        title:
          en: Export folder
          vi: Thư mục xuất
        description:
          en: Where exports are saved. Empty uses the downloads folder.
          vi: Nơi lưu các tệp xuất ra. Để trống để dùng thư mục Tải về.
    query:
      query_timeout_secs:
        title:
          en: Query timeout
          vi: Thời gian chờ truy vấn
        description:
          en: Seconds a query may run before it is cancelled. 0 means no limit.
          vi: Số giây một truy vấn được chạy trước khi bị huỷ. 0 là không giới hạn.
      connect_timeout_secs:
        title:
          en: Connect timeout
          vi: Thời gian chờ kết nối
        description:
          en: Seconds to wait for a connection. 0 means the driver default.
          vi: Số giây chờ một kết nối. 0 là dùng mặc định của driver.
      keep_alive_secs:
        title:
          en: Connection keep-alive interval
          vi: Chu kỳ giữ kết nối
        description:
          en: "Seconds an open connection may sit idle before tablex checks it is still alive, so one that died (a server restart, a night asleep) is noticed and reopened on its next use. 0 means never check."
          vi: "Số giây một kết nối đang mở được nằm yên trước khi tablex kiểm tra nó còn sống không, để kết nối đã chết (máy chủ khởi động lại, máy ngủ qua đêm) được phát hiện và mở lại ở lần dùng kế tiếp. 0 là không kiểm tra."
      history_record:
        title:
          en: Record query history
          vi: Ghi lại lịch sử truy vấn
        description:
          en: "Put every run in the Query History: when, how long, how many rows or the error, and the statement. Off records nothing new; what is already there stays until you delete it."
          vi: "Ghi mọi lần chạy vào Lịch sử truy vấn: thời điểm, thời gian chạy, số dòng hoặc lỗi, và câu lệnh. Tắt thì không ghi thêm; những gì đã có vẫn còn cho đến khi bạn xoá."
      history_keep_days:
        title:
          en: Keep query history for (days)
          vi: Giữ lịch sử truy vấn trong (ngày)
        description:
          en: "Runs older than this are deleted from the Query History when tablex starts. 0 keeps them for ever."
          vi: "Những lần chạy cũ hơn số ngày này bị xoá khỏi Lịch sử truy vấn khi tablex khởi động. 0 là giữ mãi."
      pg_dump_path:
        title:
          en: pg_dump
          vi: pg_dump
        description:
          en: The pg_dump program to back up PostgreSQL with. Empty looks for it on your PATH and in the usual install folders and takes the newest version that is not older than the server. A path set here is used as it is.
          vi: "Chương trình pg_dump dùng để sao lưu PostgreSQL. Để trống thì tìm trong PATH và các thư mục cài đặt thường dùng, rồi lấy bản mới nhất không cũ hơn máy chủ. Đường dẫn đặt ở đây được dùng nguyên như vậy."
      pg_restore_path:
        title:
          en: pg_restore
          vi: pg_restore
        description:
          en: The pg_restore program to restore PostgreSQL archives with. Empty looks for it like pg_dump.
          vi: Chương trình pg_restore dùng để khôi phục tệp lưu trữ PostgreSQL. Để trống thì tìm giống như pg_dump.
      mysqldump_path:
        title:
          en: mysqldump
          vi: mysqldump
        description:
          en: "The mysqldump program to back up MySQL with (and MariaDB, when it has no mariadb-dump). Empty looks for it on your PATH and in the usual install folders."
          vi: "Chương trình mysqldump dùng để sao lưu MySQL (và MariaDB, khi không có mariadb-dump). Để trống thì tìm trong PATH và các thư mục cài đặt thường dùng."
      mariadb_dump_path:
        title:
          en: mariadb-dump
          vi: mariadb-dump
        description:
          en: The mariadb-dump program to back up MariaDB with. Empty looks for it on your PATH and in the usual install folders.
          vi: Chương trình mariadb-dump dùng để sao lưu MariaDB. Để trống thì tìm trong PATH và các thư mục cài đặt thường dùng.
    navigation:
      connection_sort:
        title:
          en: Sort connections
          vi: Sắp xếp kết nối
        description:
          en: Order of connections in the sidebar.
          vi: Thứ tự các kết nối trên thanh bên.
        options:
          manual:
            en: Manual
            vi: Thủ công
          ascending:
            en: Name A-Z
            vi: Tên A-Z
          descending:
            en: Name Z-A
            vi: Tên Z-A
      global_search:
        title:
          en: Search unloaded catalogs
          vi: Tìm trong catalog chưa tải
        description:
          en: Sidebar search also crawls catalogs that were never expanded.
          vi: Tìm kiếm trên thanh bên cũng quét cả các catalog chưa từng được mở.
      show_system_objects:
        title:
          en: Show system objects
          vi: Hiện đối tượng hệ thống
        description:
          en: Default for connections without their own visible-objects filter.
          vi: Mặc định cho các kết nối không có bộ lọc đối tượng hiển thị riêng.
      navigator_page_size:
        title:
          en: Navigator page size
          vi: Số mục mỗi lần tải của thanh bên
        description:
          en: "Objects loaded per \"load more\" in the sidebar tree."
          vi: "Số đối tượng tải về mỗi lần bấm \"tải thêm\" trong cây thanh bên."
      connection_double_click:
        title:
          en: Double-click a connection
          vi: Nhấp đúp vào kết nối
        description:
          en: What double-clicking a connection does. Connect or disconnect and Open a new SQL editor leave a single click to only select it; the arrow still expands.
          vi: Việc xảy ra khi nhấp đúp vào một kết nối. Với Kết nối hoặc ngắt kết nối và Mở trình soạn SQL mới, nhấp một lần chỉ chọn; mũi tên vẫn mở rộng nhánh.
        options:
          expand:
            en: Expand or collapse
            vi: Mở rộng hoặc thu gọn
          connect:
            en: Connect or disconnect
            vi: Kết nối hoặc ngắt kết nối
          new_query:
            en: Open a new SQL editor
            vi: Mở trình soạn SQL mới
      expand_on_connect:
        title:
          en: Expand on connect
          vi: Mở rộng khi kết nối
        description:
          en: A connection made by hand (Connect, a double-click, the palette) opens its first level in the tree.
          vi: Kết nối do bạn tự thực hiện (Kết nối, nhấp đúp, bảng lệnh) sẽ mở cấp đầu tiên trong cây.
      group_by_driver:
        title:
          en: Group by database type
          vi: Nhóm theo loại cơ sở dữ liệu
        description:
          en: The tree lists connections under a section per database type; your own groups stay inside each section.
          vi: Cây liệt kê kết nối dưới từng mục theo loại cơ sở dữ liệu; các nhóm của bạn nằm trong mỗi mục.
      restore_tree_state:
        title:
          en: Remember the tree
          vi: Ghi nhớ cây
        description:
          en: The nodes you left open come back when their connection connects after a restart. Nothing connects only to restore the tree.
          vi: Các nút bạn để mở sẽ quay lại khi kết nối của chúng được kết nối sau khi khởi động lại. Không có kết nối nào được tạo chỉ để khôi phục cây.
      show_table_stats:
        title:
          en: Show table sizes
          vi: Hiện kích thước bảng
        description:
          en: Table rows show an estimate of their rows and size, read from the server's catalog once per folder.
          vi: Các dòng bảng hiện ước tính số dòng và dung lượng, đọc từ danh mục của máy chủ một lần cho mỗi thư mục.
      table_double_click:
        title:
          en: Double-click a table
          vi: Nhấp đúp vào bảng
        description:
          en: What double-clicking a table or view opens.
          vi: Việc xảy ra khi nhấp đúp vào một bảng hoặc view.
        options:
          data:
            en: Open data
            vi: Mở dữ liệu
          properties:
            en: Open properties
            vi: Mở thuộc tính
          diagram:
            en: Open diagram
            vi: Mở sơ đồ
      single_click_opens:
        title:
          en: Single click opens
          vi: Nhấp một lần để mở
        description:
          en: A single click on a table opens it instead of only selecting it.
          vi: Nhấp một lần vào bảng sẽ mở nó thay vì chỉ chọn.
      open_data_tabs_next_to_active:
        title:
          en: Open data tabs next to the active tab
          vi: Mở tab dữ liệu cạnh tab đang chọn
        description:
          en: New data tabs open beside the active tab instead of at the end.
          vi: Tab dữ liệu mới mở ngay cạnh tab đang chọn thay vì ở cuối.
      restore_tabs:
        title:
          en: Restore tabs on start
          vi: Khôi phục tab khi khởi động
        description:
          en: Which tabs come back after restarting tablex.
          vi: Những tab nào quay lại sau khi khởi động lại tablex.
        options:
          all:
            en: All tabs
            vi: Tất cả tab
          pinned:
            en: Pinned tabs only
            vi: Chỉ tab đã ghim
          none:
            en: None
            vi: Không
    ai:
      provider:
        title:
          en: Provider
          vi: Nhà cung cấp
        description:
          en: "Who answers the assistant's questions. The API key, the model and the address below are kept for each provider."
          vi: "Bên trả lời các câu hỏi của trợ lý. Khoá API, mô hình và địa chỉ bên dưới được lưu riêng cho từng nhà cung cấp."
        options:
          anthropic:
            en: Anthropic
            vi: Anthropic
          openai:
            en: OpenAI
            vi: OpenAI
          openai_compatible:
            en: OpenAI-compatible
            vi: OpenAI-compatible
          ollama:
            en: Ollama
            vi: Ollama
      model:
        title:
          en: Model
          vi: Mô hình
        description:
          en: "The model the assistant uses. Refresh loads the provider's current list."
          vi: Mô hình mà trợ lý dùng. Làm mới sẽ tải danh sách hiện tại của nhà cung cấp.
      effort:
        title:
          en: Reasoning effort
          vi: Mức suy luận
        description:
          en: "How much the model thinks before it answers: low is quick, max is thorough and slower. A change applies from the next new chat."
          vi: "Mức mô hình suy nghĩ trước khi trả lời: thấp thì nhanh, tối đa thì kỹ hơn nhưng chậm hơn. Thay đổi có hiệu lực từ cuộc trò chuyện mới kế tiếp."
        options:
          low:
            en: Low
            vi: Thấp
          medium:
            en: Medium
            vi: Trung bình
          high:
            en: High
            vi: Cao
          xhigh:
            en: Extra high
            vi: Rất cao
          max:
            en: Max
            vi: Tối đa
      fallback:
        title:
          en: Retry a declined request on a fallback model
          vi: Thử lại bằng mô hình dự phòng khi yêu cầu bị từ chối
        description:
          en: "When the model declines a request, let Anthropic answer it with a fallback model instead. Only Anthropic has this."
          vi: "Khi mô hình từ chối một yêu cầu, để Anthropic trả lời bằng một mô hình dự phòng. Chỉ Anthropic có tính năng này."
      keep_conversations:
        title:
          en: Keep conversations on this computer
          vi: Lưu cuộc trò chuyện trên máy này
        description:
          en: "Each finished conversation is saved in tablex's app database (tablex.db in its data folder), so History can reopen it. They can contain query results. Turning this off stops saving; it does not delete what is saved."
          vi: "Mỗi cuộc trò chuyện đã xong được lưu trong cơ sở dữ liệu ứng dụng của tablex (tablex.db trong thư mục dữ liệu), để Lịch sử có thể mở lại. Chúng có thể chứa kết quả truy vấn. Tắt thì ngừng lưu; không xoá những gì đã lưu."
      agent_access:
        title:
          en: Default agent access
          vi: Quyền truy cập mặc định của agent
        description:
          en: "How far the assistant and MCP clients may go on a connection that sets no level itself. Production connections stay off: they need a level of their own. Read and write applies to connections that are not Production; each change is still put to you for approval. A client set to auto-approve can run changes without you seeing them, so only use clients you trust."
          vi: "Mức mà trợ lý và các client MCP được phép làm trên một kết nối không tự đặt mức. Kết nối Production luôn tắt: chúng cần mức riêng. Đọc và ghi áp dụng cho các kết nối không phải Production; mỗi thay đổi vẫn được hỏi bạn duyệt. Client được đặt để tự duyệt có thể chạy thay đổi mà bạn không thấy, nên chỉ dùng client bạn tin cậy."
        options:
          "off":
            en: "Off"
            vi: Tắt
          schema:
            en: Schema only
            vi: Chỉ schema
          read:
            en: Read
            vi: Đọc
          read_write:
            en: Read and write
            vi: Đọc và ghi
      base_url:
        title:
          en: Base URL
          vi: URL gốc
        description:
          en: "The provider's address. Use https://; http:// only for a server on this machine, such as Ollama or LM Studio."
          vi: "Địa chỉ của nhà cung cấp. Dùng https://; http:// chỉ cho máy chủ trên máy này, như Ollama hoặc LM Studio."
