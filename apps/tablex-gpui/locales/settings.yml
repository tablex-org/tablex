    built_in_only:
      en: Only the built-in formatter uses this.
      vi: Chỉ trình định dạng tích hợp sẵn dùng mục này.
    external_only:
      en: Used when the formatter is an external command.
      vi: Dùng khi trình định dạng là lệnh ngoài.
    built_in_needs_no_process:
      en: The built-in formatter needs no process.
      vi: Trình định dạng tích hợp sẵn không cần tiến trình.
    fallback_anthropic_only:
      en: "Not available: only Anthropic can retry on a fallback model."
      vi: "Không khả dụng: chỉ Anthropic mới thử lại được bằng mô hình dự phòng."
  model:
    id_placeholder:
      en: Model id
