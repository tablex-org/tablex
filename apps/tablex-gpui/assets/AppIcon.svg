<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- tablex app icon: a blue-violet database cylinder whose side is drawn as a table, on a
       white tile. macOS grid: an 824 px rounded square centred on a 1024 canvas. Rendered to
       AppIcon.png (1024 px) for scripts/bundle-macos.sh with:
       rsvg-convert -w 1024 -h 1024 AppIcon.svg -o AppIcon.png -->
<defs>
<linearGradient id="aTile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#EEF1F6"></stop></linearGradient>
<linearGradient id="aBody" x1="282" y1="0" x2="742" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2F6BFF"></stop><stop offset="1" stop-color="#6A42F5"></stop></linearGradient>
<linearGradient id="aTop" x1="282" y1="230" x2="742" y2="370" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9CC2FF"></stop><stop offset="1" stop-color="#A893FF"></stop></linearGradient>
<linearGradient id="aShade" x1="0" y1="300" x2="0" y2="790" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="1" stop-color="#0B1240" stop-opacity="0.28"></stop></linearGradient>
<clipPath id="aBodyClip"><path d="M282 300 L282 720 A230 70 0 0 0 742 720 L742 300 Z"></path></clipPath>
</defs>
<filter id="aDrop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="40" flood-color="#000" flood-opacity="0.45"/></filter><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#aTile)" filter="url(#aDrop)"></rect>
<ellipse cx="512" cy="812" rx="250" ry="38" fill="#1B2A6B" fill-opacity="0.14"></ellipse>
<path d="M282 300 L282 720 A230 70 0 0 0 742 720 L742 300 Z" fill="url(#aBody)"></path>
<path d="M282 300 L282 720 A230 70 0 0 0 742 720 L742 300 Z" fill="url(#aShade)"></path>
<path d="M282 300 L282 440 A230 70 0 0 0 742 440 L742 300 Z" fill="#FFFFFF" fill-opacity="0.16"></path>
<path d="M318 330 L318 700 Q324 730 350 742 L350 340 Z" fill="#FFFFFF" fill-opacity="0.22"></path>
<g fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round" clip-path="url(#aBodyClip)">
<path d="M282 440 A230 70 0 0 0 742 440"></path>
<path d="M282 580 A230 70 0 0 0 742 580"></path>
<line x1="380" y1="497" x2="380" y2="771"></line>
<line x1="644" y1="497" x2="644" y2="771"></line>
</g>
<ellipse cx="512" cy="300" rx="230" ry="70" fill="url(#aTop)"></ellipse>
<ellipse cx="470" cy="286" rx="120" ry="26" fill="#FFFFFF" fill-opacity="0.35"></ellipse>
</svg>
